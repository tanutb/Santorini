# Publish the static site (agent and pass-and-play games run in the browser) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
# Optional, as repository secrets or variables (a secret wins if both exist): SANTORINI_SERVER_URL (a hosted
# game server, enables online games) and SANTORINI_API_KEY (the server's public client key). Both end up in
# the public page either way: a secret only hides them in the workflow logs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test rules, network parity and helpers
        run: node --test "tests/*.test.js"
      - name: Build the static site
        run: node scripts/build.mjs
        env:
          SANTORINI_SERVER_URL: ${{ secrets.SANTORINI_SERVER_URL || vars.SANTORINI_SERVER_URL }}
          SANTORINI_API_KEY: ${{ secrets.SANTORINI_API_KEY || vars.SANTORINI_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
